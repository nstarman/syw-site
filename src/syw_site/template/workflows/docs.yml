name: Docs site

# Builds the paper's docs site (syw-site {{VERSION}}) on every push and pull request, and publishes
# it to nstarkman.space/{{NAME}}/ only when docs/syw-site.yml says `publish: true` — set that at
# arXiv submission, with the repository public and Pages set to "GitHub Actions". Until then
# nothing leaves this workflow: no Pages artifact is uploaded.
#
# The environment below installs showyourwork and syw-site with pip; adapt it to how this paper
# runs showyourwork (its Zenodo cache token, extra flags after `--`).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.settings.outputs.publish }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install showyourwork and syw-site
        run: pip install "showyourwork==0.4.3" "syw-site @ git+https://github.com/nstarman/syw-site@v{{VERSION}}"
      - name: Build the paper and its docs site
        run: syw-site build --cores 2
      - name: Read the publish setting
        id: settings
        run: |
          python -c "import yaml; print('publish=' + str(bool(yaml.safe_load(open('docs/syw-site.yml'))['publish'])).lower())" >> "$GITHUB_OUTPUT"
      - name: Refuse to publish from a private repository
        if: steps.settings.outputs.publish == 'true' && github.event.repository.private
        run: |
          echo "::error::docs/syw-site.yml says publish: true, but this repository is private. Make it public at arXiv submission, or set publish: false."
          exit 1
      - name: Upload the site for Pages
        if: steps.settings.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
