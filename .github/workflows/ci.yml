name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest
      - name: Release tag matches syw_site.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(uv run python -c 'import syw_site; print(syw_site.__version__)')"

  # The docs scaffold builds with a fixture facts.json and stops on an unknown name.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync
      - run: uv run pytest -m site

  # The synthetic example paper, end to end: showyourwork (main, pinned), TeX, the docs rules,
  # the webapp and the site — then every page and number checked.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install showyourwork and this syw-site
        run: pip install "showyourwork @ git+https://github.com/showyourwork/showyourwork@44d15103f64c3162e4a1a961f49f77d8e3634e49" .
      - name: The example as a fresh repository
        run: |
          cp -R examples/paper "$RUNNER_TEMP/syw-site-example"
          cd "$RUNNER_TEMP/syw-site-example"
          git init -q -b main
          git config user.name ci && git config user.email ci@example.invalid
          git remote add origin https://github.com/nstarman/syw-site-example.git
          syw-site init
          printf 'webapps:\n  helix: { inputs: [src/data/helix.npz], figure: "fig:helix" }\n' >> docs/syw-site.yml
          git add -A && git commit -qm example
      - name: syw-site build
        working-directory: ${{ runner.temp }}/syw-site-example
        run: syw-site build --cores 2
      - name: Check the site
        run: python tests/e2e_check.py "$RUNNER_TEMP/syw-site-example"
      - uses: actions/upload-artifact@v4
        with:
          name: example-site
          path: ${{ runner.temp }}/syw-site-example/docs/dist

  # A live preview of the example's site for every pull request (the example is synthetic, so
  # this publishes nothing of a real paper). Needs the repository secrets CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID (as figkit's tests.yml explains); passes without deploying until then.
  preview:
    if: github.event_name == 'pull_request'
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "Cloudflare secrets are not set." >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: example-site
          path: preview/syw-site-example  # the site's base path
      - if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create syw-site --production-branch=main
        continue-on-error: true  # "already exists" is the normal case
      - if: steps.guard.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy preview --project-name=syw-site --branch=pr-${{ github.event.number }}
      - if: steps.guard.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview
          message: |
            **Preview of the example site:** ${{ steps.deploy.outputs.deployment-alias-url || format('https://pr-{0}.syw-site.pages.dev', github.event.number) }}/syw-site-example/

            Links into nstarkman.space (the nav) do not resolve on the preview host.

  # The one check branch protection requires.
  ci-pass:
    name: CI Pass
    if: always()
    needs: [unit, site, e2e, preview]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: preview
          jobs: ${{ toJSON(needs) }}
